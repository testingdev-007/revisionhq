<!DOCTYPE html>
<html lang="en-GB">
<head>

<title>Inspector Clause: The Grammar Case Files</title>
<style>
:root{--navy:#14213d;--navy2:#1f3160;--manila:#f4e4bc;--manila2:#e6cf94;--paper:#fffdf6;--ink:#1f2430;--muted:#6b6250;--red:#c0392b;--green:#25854f;--gold:#e0a526;--blue:#2f6fb5;--line:#d9cfb4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

.tw{font-family:"Courier New",Courier,monospace}
button{font:inherit;cursor:pointer}

.weight{display:inline-block;font-size:11px;background:rgba(0,0,0,.08);border-radius:6px;padding:1px 6px;margin-top:6px}

.qwrap{position:relative}
.qbar{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px;flex-wrap:wrap}

.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:-8px 0 10px;font-family:"Courier New",monospace}

.stem{background:#fff;border:2px dashed var(--line);border-radius:10px;padding:14px 16px;font-size:20px;margin:0 0 14px;line-height:2}

.tok.sel{border-color:var(--red);border-style:solid}
.tok.right{border-color:var(--green);border-style:solid;background:#e5f5ea}
.tok.miss{border-color:var(--green);border-style:dashed}
.tok.wrong{border-color:var(--red);background:#fbe9e7}
.tok.p{padding:0;margin-left:-4px}

.chunk.wrong{border-bottom:4px solid var(--red);background:#fbe9e7}

tr.rowok td{background:#e5f5ea}
tr.rowbad td{background:#fbe9e7}

.mcol{display:grid;gap:9px;align-content:start}

.typed.wrong{border-color:var(--red);background:#fbe9e7}

.gap.filled{border-style:solid;border-color:var(--blue);background:#eef4fc}
.gap.right{border-color:var(--green);color:var(--green);background:#e5f5ea}

.box2{display:inline-block;width:22px;height:24px;border:2px solid #333;vertical-align:middle;margin:0 2px;background:#fff}
.hl{background:#ffe38a;padding:0 3px;border-radius:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1f4f86}

.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.fb.good{background:#e5f5ea;border:2px solid #9ad3ae}

.fb.hint{background:#fff6da;border:2px solid #ecd27e}
.fb .mini{flex:0 0 44px}
.why{margin-top:12px;background:#f3f7fd;border:2px solid #c8d8f0;border-radius:12px;padding:12px 16px}

.why ol{margin:0;padding-left:22px}
.why li{margin:5px 0}

.stamp.r{border-color:var(--red);color:var(--red)}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.85}}
.panel{background:var(--paper);border-radius:14px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.35);margin-bottom:16px}
.panel h2{font-family:"Courier New",monospace;margin:0 0 10px}
.panel h3{font-family:"Courier New",monospace;margin:18px 0 6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0}
.kv div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px}
.kv b{display:block;font-size:24px;font-family:"Courier New",monospace}
.bars .bar{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}
.bars .bar span:first-child{flex:0 0 210px}
.bars .track{flex:1;height:14px;background:#eee4cc;border-radius:7px;overflow:hidden}
.bars .fill{height:100%;background:var(--blue)}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tro{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;opacity:.5;filter:grayscale(1)}
.tro.got{opacity:1;filter:none;border-color:var(--gold);background:#fff8e2}
.tro .ic{font-size:30px}
.tro b{display:block;font-size:14px}
.tro small{font-size:12.5px;color:var(--muted)}
.gloss{display:grid;gap:10px}
.gitem{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.gitem b{font-family:"Courier New",monospace;font-size:16px}
.gitem .ex{font-size:14.5px;color:#3d4a63;margin-top:3px}
.gitem .btn{padding:6px 12px;font-size:13px;margin-top:6px}
.review{display:grid;gap:8px}
.ritem{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.ritem.ok{border-left:8px solid var(--green)}.ritem.no{border-left:8px solid var(--red)}
.timer{font-family:"Courier New",monospace;font-weight:700;font-size:20px;background:rgba(0,0,0,.25);padding:3px 10px;border-radius:8px}
.timer.low{color:#ffb3a8}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff8e2;border:3px solid var(--gold);border-radius:14px;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;animation:pop .4s}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;animation:fl .5s forwards}
@keyframes fl{0%{opacity:.35}100%{opacity:0}}
.rapidscore{font:900 40px "Courier New",monospace;color:#fff}
.small{font-size:13.5px;color:var(--muted)}
.tag-type{display:inline-block;background:#eef4fc;border:1px solid #c8d8f0;border-radius:6px;padding:1px 7px;font-size:12.5px;margin:2px}
@media (max-width:640px){
 body{font-size:16px}.stem,.tok,.chunk,.gapline{font-size:18px}.prompt{font-size:17px}
 .match{grid-template-columns:1fr 1fr;gap:8px}.mitem{font-size:14px}
 .bars .bar span:first-child{flex-basis:130px}
 .stamp{font-size:18px;top:auto;bottom:12px}
 header.top h1{font-size:18px}
 table.tt{font-size:14px}table.tt th{font-size:10.5px;padding:5px 2px;word-break:break-word}table.tt td{padding:5px 3px}table.tt td:first-child{min-width:128px}.cell{width:26px;height:26px}
 .qbar .ttl{min-width:0;font-size:14px}
}
</style>

<script>
"use strict";
/* ============ helpers ============ */
const R=n=>Math.floor(Math.random()*n);
const pick=a=>a[R(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();
const NOSPACE_BEFORE=/^[,.!?;:)”’]/; const NOSPACE_AFTER=/[(“]$/;

const NAMES=[['Maya','f'],['Leo','m'],['Aisha','f'],['Tom','m'],['Zara','f'],['Sam','m'],['Priya','f'],['Jack','m'],['Ella','f'],['Omar','m'],['Ruby','f'],['Finn','m'],['Isla','f'],['Kai','m'],['Amira','f'],['Noah','m']];
const nm=()=>pick(NAMES);
function twoNames(){const s=sample(NAMES,2);return s;}
const HE=g=>g==='f'?'she':'he';
const ANIMALS=['fox','rabbit','puppy','kitten','owl','badger','hedgehog','squirrel','pony','goose'];
const ANADJ=['hungry','clever','sleepy','nervous','tiny','scruffy','curious','playful'];
const MOVES={crept:['under','behind','past','beside'],raced:['across','through','past'],wandered:['through','across','past','near'],hid:['under','behind','beside'],scurried:['under','across','past','behind'],tiptoed:['past','across','behind']};
const PREPPLACE={under:['fence','bridge','hedge','table'],behind:['shed','hedge','wall','fence'],through:['garden','field','woods'],across:['field','garden','bridge','playground'],past:['shed','wall','gate','pond'],beside:['pond','wall','gate','shed'],near:['pond','gate','river']};
const MANNER=['silently','quickly','nervously','happily','carefully','slowly','bravely','quietly'];
const art=w=>/^[aeiou]/i.test(w)?'an':'a';

/* ============ generator registry ============ */
const G={};
function def(id,dom,code,skill,fast,fn){G[id]={id,dom,code,skill,fast,fn};}
function make(id){const g=G[id];const q=g.fn();q.id=id;q.dom=g.dom;q.code=q.code||g.code;q.skill=g.skill;q.marks=q.marks||1;return q;}

const DEF={
 noun:'A <b>noun</b> names a person, place, thing or idea. Test: can you put “the” or “a” in front of it – or is it a name?',
 verb:'A <b>verb</b> is a doing or being word. Test: can you change its tense (walk → walked)?',
 adjective:'An <b>adjective</b> describes a noun – it tells you more about a person, place or thing.',
 adverb:'An <b>adverb</b> adds to a verb (or an adjective/another adverb). It often tells you <i>how, when, where</i> or <i>how often</i>.',
 preposition:'A <b>preposition</b> links a noun (or pronoun) to the rest of the sentence, showing place, time or cause. It is followed by a noun phrase – not a whole clause.',
 determiner:'A <b>determiner</b> comes before a noun to say which one or how many: <i>the, a, an, this, those, some, every, my</i>…',
 conjunction:'A <b>conjunction</b> joins words or clauses together: <i>and, but, or, because, when, although, if</i>…',
 pronoun:'A <b>pronoun</b> stands in for a noun so we don’t repeat it: <i>I, you, he, she, it, we, they, him, her, us, them</i>…'
};

/* -------- G1 word classes -------- */
function tmplA(){const adj=pick(ANADJ),an=pick(ANIMALS),v=pick(Object.keys(MOVES)),pr=pick(MOVES[v]),pl=pick(PREPPLACE[pr]),ad=pick(MANNER);
 return [['The','determiner',`“The” sits before the noun “${an}”.`],[adj,'adjective',`“${adj}” describes the noun “${an}”.`],[an,'noun',`“${an}” names a thing (an animal).`],[v,'verb',`“${v}” is the action – what the ${an} did.`],[ad,'adverb',`“${ad}” tells us <i>how</i> the ${an} ${v}.`],[pr,'preposition',`“${pr}” links the verb to “the ${pl}” and shows <i>where</i>.`],['the','determiner',`“the” sits before the noun “${pl}”.`],[pl,'noun',`“${pl}” names a place or thing.`],['.','']];}
function tmplB(){const t=pick(['Yesterday','Later','Earlier','Soon']),n=nm()[0],v=pick(['found','dropped','spotted','buried','lost']),adj=pick(['shiny','tiny','old','mysterious','golden','crumpled']),o=pick(['key','coin','map','shell','feather','letter']),pr=pick(['beside','under','near','behind']),pl=pick(PREPPLACE[pr]);const d=art(adj);
 return [[t,'adverb',`“${t}” is an adverb telling us <i>when</i> it happened.`],[',',''],[n,'noun',`“${n}” is a name – a proper noun.`],[v,'verb',`“${v}” is the action – what ${n} did.`],[d,'determiner',`“${d}” sits before the noun phrase “${adj} ${o}”.`],[adj,'adjective',`“${adj}” describes the noun “${o}”.`],[o,'noun',`“${o}” names a thing.`],[pr,'preposition',`“${pr}” links “the ${pl}” to the rest of the sentence and shows <i>where</i>.`],['the','determiner',`“the” sits before the noun “${pl}”.`],[pl,'noun',`“${pl}” names a place or thing.`],['.','']];}
function tmplC(){const [n,g]=nm();const f=pick([['laughed','loudly',['happy','excited']],['cheered','loudly',['excited','proud']],['sighed','sadly',['bored','tired']],['smiled','shyly',['nervous','happy']],['yawned','sleepily',['tired','bored']],['waited','patiently',['calm','relaxed']]]);const fe=pick(f[2]);const p=HE(g);
 return [[n,'noun',`“${n}” is a name – a proper noun.`],[f[0],'verb',`“${f[0]}” is the action – what ${n} did.`],[f[1],'adverb',`“${f[1]}” tells us <i>how</i> ${n} ${f[0]}.`],['because','conjunction','“because” joins the two clauses and gives a reason.'],[p,'pronoun',`“${p}” replaces the noun “${n}” so we don’t repeat the name.`],['was','verb','“was” is a <i>being</i> verb (part of “to be”).'],[fe,'adjective',`“${fe}” describes ${n} (the pronoun “${p}”).`],['.','']];}
function tmplD(){const [a,b]=twoNames();const gm=pick(['chess','football','cards','tennis']);const pr=pick(['after','before']);const tn=pick(['lunch','school','dinner','breakfast']);
 return [[a[0],'noun',`“${a[0]}” is a name – a proper noun.`],['and','conjunction','“and” joins the two names together.'],[b[0],'noun',`“${b[0]}” is a name – a proper noun.`],['played','verb','“played” is the action.'],[gm,'noun',`“${gm}” names a thing (a game).`],[pr,'preposition',`“${pr}” is followed by the noun “${tn}” – no verb follows it, so here it is a preposition showing <i>time</i>.`],[tn,'noun',`“${tn}” names a thing (a meal or time of day).`],['.','']];}

 G4:[['Simple present & past','One verb word.','she <u>walks</u> / she <u>walked</u>',['vb_table','vb_tick']],['Progressive','is/was + -ing: an action in progress.','I <u>was reading</u>.',['vb_table','vb_write']],['Perfect','has/have/had + past participle.','She <u>has eaten</u>. We <u>had left</u>.',['vb_table','vb_write','vb_tick']],['Modal verbs','Show possibility, certainty or obligation.','You <u>might</u> win. You <u>must</u> stop.',['vb_modal','vb_certain']],['Tense consistency','Keep the same tense unless the time changes.','Yesterday I <u>walked</u> and <u>played</u>.',['vb_consist']],['Passive voice','The thing acted on becomes the subject: was/were + participle (+ by…).','The cake <u>was eaten</u> by the dog.',['vb_passive']],['Subjunctive','Formal form: If I were…; insist that he be…','If I <u>were</u> you…',['vb_subj']]],
 G5:[['Capital letters','Sentence starts, names, places, days, months and “I”.','On <u>M</u>onday, <u>I</u> visited <u>L</u>ondon.',['pu_caps']],['Commas in lists','Separate items; not usually before the final “and”.','eggs, milk, flour and sugar',['pu_list']],['Commas for clarity','Change or clarify meaning.','Let’s eat, Grandma!',['pu_ambig','pu_fronted']],['Inverted commas','Go around the spoken words; speech punctuation goes inside.','“Stop<u>,</u>” said Dad.',['pu_speech']],['Apostrophes','Show missing letters or possession.','it’s (it is); the girls’ coats',['pu_apos','pu_plural','pu_contr']],['Parenthesis','Extra information in a pair of commas, brackets or dashes.','My uncle <u>(a chef)</u> cooked.',['pu_paren']],['Colon','Introduces a list or explanation.','You need three things<u>:</u> …',['pu_box','pu_name']],['Semi-colon','Joins two related main clauses.','It was late<u>;</u> we hurried home.',['pu_box','pu_name']],['Dash vs hyphen','Dash ( – ) separates clauses; hyphen ( - ) joins words.','man-eating; I looked – nothing!',['pu_hyph','pu_box']],['Bullet points','Punctuate every point the same way.','• bread • butter • cheese',['pu_bullet']]],
 G6:[['Synonym & antonym','Same meaning / opposite meaning.','huge = enormous; huge ≠ tiny',['vo_syn']],['Prefix','Added to the start of a word.','<u>un</u>happy, <u>re</u>write, <u>im</u>possible',['vo_prefix','vo_match']],['Suffix','Added to the end; can change the word class.','kind<u>ness</u>, enjoy<u>ment</u>, pur<u>ify</u>',['vo_suffix']],['Word family','Words from the same root with linked meanings.','sign, signal, signature',['vo_family']]],
 G7:[['Standard English','The form used in formal speech and writing.','We <u>were</u> (not we was); I <u>did</u> it',['se_circle','se_tick']],['Formal vocabulary','Words suited to official writing.','ask for → <u>request</u>',['se_match','se_formal']],['Formal structures','No contractions or chat; may use the subjunctive.','Should you require help…',['se_formal','vb_subj']]]
};

let AC=null;
function sfx(k){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq={good:[[660,.08],[880,.12]],bad:[[220,.18]],trophy:[[523,.1],[659,.1],[784,.1],[1046,.2]],tick:[[500,.03]],stamp:[[140,.1]]}[k]||[];let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='bad'||k==='stamp'?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d;});}catch(e){}}
function toast(html){const d=document.createElement('div');d.className='toast';d.innerHTML=html;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
function flash(c){const d=document.createElement('div');d.className='flash';d.style.background=c;document.body.appendChild(d);setTimeout(()=>d.remove(),500);}
const cv=document.getElementById('fx');let parts=[],raf=null;
function confetti(){const W=cv.width=innerWidth,H=cv.height=innerHeight;for(let i=0;i<120;i++)parts.push({x:W/2,y:H/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,c:pick(['#e0a526','#c0392b','#2f6fb5','#25854f','#f4e4bc']),s:4+Math.random()*6,r:Math.random()*6,life:90+R(40)});if(!raf)loop();}
function loop(){const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;p.life--;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);raf=parts.length?requestAnimationFrame(loop):(x.clearRect(0,0,cv.width,cv.height),null);}

const app=document.getElementById('app');
let Q=null; // session
const PALETTE_COL=['#2f6fb5','#c0392b','#25854f','#b8860b','#7d3c98','#16a085'];
function joinHTML(toks,fn){let h='';toks.forEach((t,i)=>{const sp=i>0&&!NOSPACE_BEFORE.test(t)&&!NOSPACE_AFTER.test(toks[i-1])?' ':'';h+=sp+fn(t,i);});return h;}
function qBody(q){
 let h=`<div class="qmeta"><span>${esc(q.code)} · ${esc(q.skill)}</span><span>${q.marks} mark</span></div><p class="prompt">${q.prompt}</p>`;
 if(q.note)h+=`<p class="note">${q.note}</p>`;
 if(q.stem)h+=`<div class="stem">${q.stem}</div>`;
 const u=q.ui;
 if(q.type==='tick'){h+=`<div class="opts">${q.options.map((o,i)=>`<button class="opt${u.sel===i?' sel':''}" data-o="${i}"><span class="box"></span><span>${o}</span></button>`).join('')}</div>`;}
 else if(q.type==='circle'){h+=`<div class="stem">${joinHTML(q.tokens,(t,i)=>/\w/.test(t)?`<button class="tok click${u.sel.includes(i)?' sel':''}" data-t="${i}">${esc(t)}</button>`:`<span class="tok p">${esc(t)}</span>`)}</div>`;}
 else if(q.type==='chunks'){h+=`<div class="stem">${q.chunks.map((c,i)=>`<button class="chunk${u.sel===i?' sel':''}" data-c="${i}">${c}</button>`).join(' ')}</div><p class="note">Tap a part of the sentence to underline it.</p>`;}
 else if(q.type==='table'){h+=`<div style="overflow-x:auto"><table class="tt"><tr><th></th>${q.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${q.rows.map((r,ri)=>`<tr data-r="${ri}"><td>${r.html}</td>${q.cols.map((c,ci)=>`<td><button class="cell${u.sel[ri]===ci?' sel':''}" data-cell="${ri},${ci}" aria-label="${strip(c)}"></button></td>`).join('')}</tr>`).join('')}</table></div>`;}
 else if(q.type==='match'){h+=`<div class="match"><div class="mcol">${q.left.map((l,i)=>`<button class="mitem${u.act===i?' act':''}" data-l="${i}">${l}${u.pairs[i]!=null?`<span class="tag" style="background:${PALETTE_COL[i]}">${i+1}</span>`:''}</button>`).join('')}</div><div class="mcol">${q.right.map((r,j)=>{const li=u.pairs.indexOf(j);return `<button class="mitem" data-rr="${j}">${r}${li>=0?`<span class="tag" style="background:${PALETTE_COL[li]}">${li+1}</span>`:''}</button>`;}).join('')}</div></div><p class="note">Tap an item on the left, then its partner on the right.</p>`;}
 else if(q.type==='type'){h+=`<input class="typed" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.placeholder||''}" value="${esc(u.val||'')}">`;}
 else if(q.type==='gaps'){h+=`<div class="stem gapline">${q.words.map((w,i)=>{let s=`<span>${esc(w)}</span>`;if(i<q.words.length-1)s+=` <button class="gap${u.sel[i]?' filled':''}" data-g="${i}">${u.sel[i]?esc(u.sel[i]):'&nbsp;'}</button> `;return s;}).join('')}</div>
  <div class="palette">${q.palette.length>1?'Choose a mark:':'Mark:'} ${q.palette.map(p=>`<button class="pbtn${u.mark===p?' on':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')} <span>then tap a gap. Tap again to remove.</span></div>`;}
 return h;
}
function initUI(q){q.ui={sel:q.type==='tick'||q.type==='chunks'?null:q.type==='table'?q.rows.map(()=>null):q.type==='gaps'?{}:[],act:null,pairs:q.type==='match'?q.left.map(()=>null):null,val:'',mark:q.palette?q.palette[0]:null};}
function answered(q){const u=q.ui;switch(q.type){case 'tick':case 'chunks':return u.sel!=null;case 'circle':return u.sel.length>0;case 'table':return u.sel.every(x=>x!=null);case 'match':return u.pairs.every(x=>x!=null);case 'type':return norm(u.val).length>0;case 'gaps':return Object.keys(u.sel).length>0;}}
function isRight(q){const u=q.ui;switch(q.type){
 case 'tick':case 'chunks':return u.sel===q.answer;
 case 'circle':{const a=[...q.answer].sort().join(),b=[...u.sel].sort().join();return a===b;}
 case 'table':return q.rows.every((r,i)=>u.sel[i]===r.ans);
 case 'match':return q.answer.every((a,i)=>u.pairs[i]===a);
 case 'type':return q.accept.some(a=>norm(a)===norm(u.val));
 case 'gaps':if(q.check)return q.check(u.sel);{const k1=Object.keys(u.sel).sort().join(),k2=Object.keys(q.answer).sort().join();return k1===k2&&Object.keys(q.answer).every(k=>u.sel[k]===q.answer[k]);}
}}
function reveal(q,root){const u=q.ui;
 if(q.type==='tick'){root.querySelectorAll('.opt').forEach((b,i)=>{if(i===q.answer)b.classList.add('right');else if(i===u.sel)b.classList.add('wrong');});}
 if(q.type==='chunks'){root.querySelectorAll('.chunk').forEach((b,i)=>{if(i===q.answer)b.classList.add('right');else if(i===u.sel)b.classList.add('wrong');});}
 if(q.type==='circle'){root.querySelectorAll('.tok.click').forEach(b=>{const i=+b.dataset.t;const inA=q.answer.includes(i),inS=u.sel.includes(i);b.classList.remove('sel');if(inA&&inS)b.classList.add('right');else if(inA)b.classList.add('miss');else if(inS)b.classList.add('wrong');});}
 if(q.type==='table'){q.rows.forEach((r,ri)=>{const tr=root.querySelector(`tr[data-r="${ri}"]`);tr.classList.add(u.sel[ri]===r.ans?'rowok':'rowbad');tr.querySelector(`[data-cell="${ri},${r.ans}"]`).classList.add('ans');});}
 if(q.type==='match'){root.querySelectorAll('[data-l]').forEach((b,i)=>b.classList.add(u.pairs[i]===q.answer[i]?'right':'wrong'));}
 if(q.type==='type'){const el=root.querySelector('#typed');el.classList.add(isRight(q)?'right':'wrong');el.disabled=true;}
 if(q.type==='gaps'){const ok=isRight(q);root.querySelectorAll('.gap').forEach(b=>{const g=b.dataset.g;if(ok){if(u.sel[g])b.classList.add('right');}else{const want=q.answer[g];const have=u.sel[g];if(want){b.textContent=want;b.classList.add(have===want?'right':'wrong');b.classList.add('filled');}else if(have){b.classList.add('wrong');}}});}
 root.querySelectorAll('button.opt,button.tok,button.chunk,button.cell,button.mitem,button.gap,button.pbtn').forEach(b=>b.disabled=true);
}
function whyHTML(q,open){return `<div class="why"${open?'':' hidden'} id="whybox"><h4>🔎 CASE NOTES – why is this the answer?</h4><ol>${q.why.map(w=>`<li>${w}</li>`).join('')}</ol><div class="ans">Answer: ${q.ansText}</div></div>`;}

function bindQ(root,q,onChange){
 root.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const u=q.ui;let hit=true;
  if(b.dataset.o!=null)u.sel=+b.dataset.o;
  else if(b.dataset.t!=null){const i=+b.dataset.t;u.sel=u.sel.includes(i)?u.sel.filter(x=>x!==i):[...u.sel,i];}
  else if(b.dataset.c!=null)u.sel=+b.dataset.c;
  else if(b.dataset.cell){const [r,c]=b.dataset.cell.split(',').map(Number);u.sel[r]=c;}
  else if(b.dataset.l!=null)u.act=+b.dataset.l;
  else if(b.dataset.rr!=null){if(u.act==null)return;const j=+b.dataset.rr;u.pairs=u.pairs.map(x=>x===j?null:x);u.pairs[u.act]=j;const nx=u.pairs.indexOf(null);u.act=nx>=0?nx:null;}
  else if(b.dataset.p!=null)u.mark=b.dataset.p;
  else if(b.dataset.g!=null){const g=b.dataset.g;if(u.sel[g]===u.mark)delete u.sel[g];else u.sel[g]=u.mark;}
  else hit=false;
  if(hit){sfx('tick');onChange();}
 };
 const ti=root.querySelector('#typed');if(ti){ti.oninput=()=>{q.ui.val=ti.value;onChange(true);};ti.onkeydown=e=>{if(e.key==='Enter'){const c=document.getElementById('checkBtn');if(c&&!c.disabled)c.click();}};}
}

/* ============ sessions ============ */
function buildList(ids,n){const out=[];let last=null;for(let i=0;i<n;i++){let pool=ids.filter(x=>x!==last);if(!pool.length)pool=ids;const id=pick(pool);out.push(make(id));last=id;}return out;}
function weightedList(n){const W={G5:.30,G1:.22,G4:.16,G3:.10,G6:.10,G2:.06,G7:.06};const counts={};let tot=0;Object.keys(W).forEach(d=>{counts[d]=Math.round(W[d]*n);tot+=counts[d];});counts.G5+=n-tot;let ids=[];Object.keys(counts).forEach(d=>{const pool=shuffle(byDom(d));for(let i=0;i<counts[d];i++)ids.push(pool[i%pool.length]);});return shuffle(ids).map(make);}
function start(mode,opts={}){
 let list,title,timer=null;
 if(mode==='case'){list=buildList(byDom(opts.dom),10);title=`${DOMS[opts.dom].icon} ${DOMS[opts.dom].name}`;}
 else if(mode==='patrol'){list=weightedList(12);title='🚓 Mixed Patrol';}
 else if(mode==='cold'){const ids=Object.keys(S.cold).filter(k=>G[k]);list=buildList(shuffle(ids).slice(0,8).length?ids:Object.keys(G),Math.min(8,Math.max(ids.length*2,4)));title='🧊 Cold Cases';}
 else if(mode==='drill'){list=buildList(opts.ids,5);title=`🧰 Drill: ${opts.term}`;if(!S.drills.includes(opts.term)){S.drills.push(opts.term);save();if(S.drills.length>=5)award('locker');}}
 else if(mode==='mock'){const n=opts.n;list=weightedList(n);title=n===50?'🏛️ The Full Trial – mock Paper 1':'⚖️ Half Paper';timer=n===50?45*60:23*60;}
 else if(mode==='rapid'){list=[];title='⚡ Rapid Interrogation';timer=90;}
 Q={mode,opts,list,i:0,title,res:[],streak:0,pts:0,hintsUsed:0,timer,ended:false};
 list.forEach(initUI);
 if(mode==='rapid'){nextRapid();}
 if(timer){clearInterval(window._tm);window._tm=setInterval(tick,1000);}
 renderQ();
}
function nextRapid(){const ids=Object.values(G).filter(g=>g.fast).map(g=>g.id);const q=make(pick(ids));initUI(q);Q.list.push(q);Q.i=Q.list.length-1;}
function tick(){if(!Q||Q.ended){clearInterval(window._tm);return;}Q.timer--;const el=document.getElementById('timer');if(el){el.textContent=fmt(Q.timer);el.classList.toggle('low',Q.timer<=(Q.mode==='rapid'?10:120));}if(Q.timer<=0){clearInterval(window._tm);finish();}}
const fmt=s=>`${Math.floor(Math.max(0,s)/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;

function renderQ(){
 const q=Q.list[Q.i];q.attempt=q.attempt||0;
 const rapid=Q.mode==='rapid',mock=Q.mode==='mock';
 const dots=rapid?`<span class="rapidscore">${Q.pts}</span>`:`<div class="dots">${Q.list.map((x,i)=>{const r=Q.res[i];return `<span class="dot${r?(r.ok?(r.full?' ok':' half'):' bad'):''}${i===Q.i?' cur':''}"></span>`;}).join('')}</div>`;
 app.innerHTML=`${topbar()}<div class="qbar"><span class="ttl">${Q.title}${rapid?'':` · ${Q.i+1}/${Q.list.length}`}</span>${dots}${Q.timer!=null?`<span class="timer" id="timer">${fmt(Q.timer)}</span>`:''}${!rapid&&!mock&&Q.streak>=3?`<span class="pill">🔥 ${Q.streak} in a row</span>`:''}<button class="iconbtn" id="quit">${mock?'✕ Stop & mark':rapid?'✕ Stop':'✕ Leave'}</button></div>
 <div class="qcard" id="qc">${qBody(q)}<div id="fbarea"></div><div class="actions" id="acts"></div></div>`;
 document.getElementById('quit').onclick=()=>{const qb=document.getElementById('quit');if(mock&&!qb.dataset.sure){qb.dataset.sure=1;qb.textContent='Tap again to mark now';return;}if(mock||rapid)finish();else home();};
 const qc=document.getElementById('qc');
 const refresh=(typing)=>{if(!typing){const fb=document.getElementById('fbarea').innerHTML;qc.innerHTML=qBody(q)+`<div id="fbarea">${fb}</div><div class="actions" id="acts"></div>`;bindQ(qc,q,refresh);}drawActs();};
 bindQ(qc,q,refresh);
 function drawActs(){const a=document.getElementById('acts');const can=answered(q);
  if(rapid)a.innerHTML=`<button class="btn" id="checkBtn" ${can?'':'disabled'}>Lock it in ✔</button><button class="btn sec" id="skip">Skip (−3s)</button>`;
  else if(mock)a.innerHTML=`<button class="btn" id="checkBtn">${Q.i===Q.list.length-1?'Finish paper':'Next question →'}</button><span class="small">No hints in the trial – just like the real thing!</span>`;
  else a.innerHTML=`<button class="btn" id="checkBtn" ${can?'':'disabled'}>${q.attempt?'Check again':'Check answer'}</button>${q.hinted?'':`<button class="btn gold" id="hintBtn">🔍 Magnifying glass</button>`}<button class="btn sec" id="whyFirst">📖 Show me the rule</button>`;
  const c=document.getElementById('checkBtn');if(c)c.onclick=check;
  const h=document.getElementById('hintBtn');if(h)h.onclick=()=>{q.hinted=true;Q.hintsUsed++;document.getElementById('fbarea').innerHTML=`<div class="fb hint"><div class="mini">🔍</div><div><b>Magnifying glass:</b> ${q.hint}<br><span class="small">(Using a clue halves the points for this question.)</span></div></div>`;drawActs();};
  const wf=document.getElementById('whyFirst');if(wf)wf.onclick=()=>{q.peeked=true;q.hinted=true;const g=Object.entries(GLOSS).flatMap(([d,a])=>a).find(x=>x[3].includes(q.id));document.getElementById('fbarea').innerHTML=`<div class="fb hint"><div class="mini">📖</div><div><b>${g?g[0]:q.skill}:</b> ${g?g[1]+' <i>e.g. '+g[2]+'</i>':q.hint}<br><span class="small">(Peeking at the rule halves the points.)</span></div></div>`;drawActs();};
  const sk=document.getElementById('skip');if(sk)sk.onclick=()=>{Q.timer-=3;Q.streak=0;nextRapid();renderQ();};
 }
 drawActs();
 function check(){
  const ok=isRight(q);const fbA=document.getElementById('fbarea');const acts=document.getElementById('acts');
  if(mock){Q.res[Q.i]={ok,full:ok,q};if(Q.i<Q.list.length-1){Q.i++;renderQ();}else finish();return;}
  if(rapid){Q.res.push({ok,q});if(ok){Q.pts++;Q.streak++;flash('#52c27e');sfx('good');nextRapid();renderQ();}else{Q.streak=0;flash('#e0605a');sfx('bad');reveal(q,qc);acts.innerHTML='';fbA.innerHTML=`<div class="fb bad"><div class="mini">${INSPECTOR(40)}</div><div><b>Answer:</b> ${q.ansText}</div></div>`;setTimeout(()=>{if(!Q.ended){nextRapid();renderQ();}},1400);}return;}
  if(ok){
   const full=!q.hinted&&q.attempt===0;let p=full?10:5;if(full){Q.streak++;if(Q.streak>=3)p+=2;}else Q.streak=0;
   S.bestStreak=Math.max(S.bestStreak,Q.streak);if(Q.streak>=5)award('streak5');if(Q.streak>=10)award('streak10');
   Q.pts+=p;S.points+=p;Q.res[Q.i]={ok:true,full,q};
   if(Q.mode==='cold'&&S.cold[q.id]){delete S.cold[q.id];S.coldCleared++;if(S.coldCleared>=3)award('cold3');}
   save();reveal(q,qc);sfx('good');sfx('stamp');const pp=document.getElementById('ptsPill');if(pp)pp.innerHTML=`${rank()[1]} · <b>${S.points}</b> pts`;
   qc.insertAdjacentHTML('beforeend',`<div class="stamp">${pick(STAMPS_OK)}</div>`);
   fbA.innerHTML=`<div class="fb good"><div class="mini">${INSPECTOR(44)}</div><div><b>${pick(QUIPS_OK)}</b> +${p} points${Q.streak>=3&&full?' (streak bonus!)':''}</div></div>${whyHTML(q,false)}`;
   acts.innerHTML=`<button class="btn green" id="nextBtn">${Q.i===Q.list.length-1?'Close the case →':'Next clue →'}</button><button class="btn sec" id="whyBtn">🤔 Why is that right?</button>`;
  } else if(q.attempt===0){
   q.attempt=1;sfx('bad');
   fbA.innerHTML=`<div class="fb bad"><div class="mini">${INSPECTOR(44)}</div><div><b>${pick(QUIPS_BAD)}</b><br>Take a <b>second look</b> (for half points) – or open the case notes to see the answer.</div></div>`;
   acts.innerHTML=`<button class="btn" id="again">🔁 Second look</button><button class="btn sec" id="giveup">📂 Show me the answer</button>`;
   document.getElementById('again').onclick=()=>{fbA.innerHTML=`<div class="fb hint"><div class="mini">🔍</div><div><b>Clue:</b> ${q.hint}</div></div>`;drawActs();};
   document.getElementById('giveup').onclick=()=>fail();
   return;
  } else {fail();return;}
  bindNext();
 }
 function fail(){const fbA=document.getElementById('fbarea'),acts=document.getElementById('acts');Q.streak=0;Q.res[Q.i]={ok:false,q};S.cold[q.id]=(S.cold[q.id]||0)+1;save();reveal(q,qc);sfx('bad');
  qc.insertAdjacentHTML('beforeend',`<div class="stamp r">COLD CASE</div>`);
  fbA.innerHTML=`<div class="fb bad"><div class="mini">${INSPECTOR(44)}</div><div><b>This one’s gone into the Cold Case files</b> – you can crack it later. Here’s how it works:</div></div>${whyHTML(q,true)}`;
  acts.innerHTML=`<button class="btn" id="nextBtn">${Q.i===Q.list.length-1?'Close the case →':'Next clue →'}</button>`;bindNext();}
 function bindNext(){document.getElementById('nextBtn').onclick=()=>{if(Q.i<Q.list.length-1){Q.i++;renderQ();}else finish();};const w=document.getElementById('whyBtn');if(w)w.onclick=()=>{const b=document.getElementById('whybox');b.hidden=!b.hidden;if(!b.hidden){S.whys++;save();if(S.whys>=15)award('curious');}};}
}
function finish(){
 if(!Q||Q.ended)return;Q.ended=true;clearInterval(window._tm);
 if(Q.mode==='rapid')return endRapid();
 if(Q.mode==='mock')return endMock();
 const n=Q.list.length,correct=Q.res.filter(r=>r&&r.ok).length,full=Q.res.filter(r=>r&&r.full).length;const pct=correct/n;
 let stars=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;let msg='';
 if(Q.mode==='case'){const d=Q.opts.dom;S.cases[d]=true;S.stars[d]=Math.max(S.stars[d]||0,stars);award('first');if(correct===10)award('perfect');if(Object.keys(DOMS).every(k=>S.cases[k]))award('allcases');if(Object.keys(DOMS).every(k=>S.stars[k]===3))award('allstars');if(d==='G5'&&stars===3)award('punct');if(Q.hintsUsed===0&&correct>=8)award('sharp');}
 save();if(stars>=2)confetti();
 const bySkill={};Q.res.forEach(r=>{if(!r)return;const k=r.q.skill;bySkill[k]=bySkill[k]||[0,0];bySkill[k][1]++;if(r.ok)bySkill[k][0]++;});
 const missed=Q.res.filter(r=>r&&!r.ok);
 app.innerHTML=`${topbar()}<div class="panel"><h2>${stars>=2?'📁 CASE CLOSED':'📁 Case report'}</h2>
 <div class="hero" style="margin:24px 0 18px">${INSPECTOR(70)}<div class="speech">${stars===3?'Outstanding work, detective. This case is airtight!':stars===2?'Solid detective work. A couple of loose ends to tie up.':stars===1?'A good start – but some clues slipped through. Check your Cold Cases!':'This one needs more investigating. Read the case notes and try again – every detective has off days.'}</div></div>
 <div class="kv"><div>Correct<b>${correct}/${n}</b></div><div>First time, no clues<b>${full}</b></div><div>Points earned<b>+${Q.pts}</b></div>${Q.mode==='case'?`<div>Stars<b>${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</b></div>`:''}</div>
 <h3>Evidence by skill</h3><div class="bars">${Object.entries(bySkill).map(([k,v])=>`<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${v[0]/v[1]*100}%;background:${v[0]===v[1]?'var(--green)':v[0]?'var(--gold)':'var(--red)'}"></div></div><span>${v[0]}/${v[1]}</span></div>`).join('')}</div>
 ${missed.length?`<h3>Cold cases opened</h3><div class="review">${missed.map((r,i)=>reviewItem(r,i)).join('')}</div>`:''}
 <div class="actions">${Q.mode==='case'?`<button class="btn" id="again">Re-open this case (new questions)</button>`:Q.mode==='drill'?`<button class="btn" id="again">Another drill</button>`:Q.mode==='patrol'?`<button class="btn" id="again">Another patrol</button>`:''}<button class="btn sec" id="hq">Back to HQ</button></div></div>`;
 bindReview();const a=document.getElementById('again');if(a)a.onclick=()=>start(Q.mode,Q.opts);document.getElementById('hq').onclick=home;
}
function reviewItem(r,i){return `<div class="ritem ${r.ok?'ok':'no'}"><div><b>${r.ok?'✔':'✘'} ${esc(r.q.skill)}</b> <span class="small">${esc(r.q.code)}</span></div><div>${r.q.prompt}${r.q.stem?' <span class="small">'+r.q.stem+'</span>':''}</div><button class="btn sec" style="padding:5px 10px;font-size:13px;margin-top:6px" data-rv="${i}">Why?</button><div class="why" hidden id="rv${i}"><ol>${r.q.why.map(w=>`<li>${w}</li>`).join('')}</ol><div class="ans">Answer: ${r.q.ansText}</div></div></div>`;}
function bindReview(){app.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{const w=document.getElementById('rv'+b.dataset.rv);w.hidden=!w.hidden;if(!w.hidden){S.whys++;save();if(S.whys>=15)award('curious');}});}
function endMock(){
 const n=Q.list.length;Q.list.forEach((q,i)=>{if(!Q.res[i])Q.res[i]={ok:false,q,skipped:true};});
 const correct=Q.res.filter(r=>r.ok).length;const pct=correct/n;S.mocks++;
 const pts=correct*5;S.points+=pts;award(n===50?'mockfull':'mockhalf');if(pct>=.8)award('mock80');
 Q.res.forEach(r=>{if(!r.ok)S.cold[r.q.id]=(S.cold[r.q.id]||0)+1;});save();if(pct>=.6)confetti();
 const dom={};Q.res.forEach(r=>{const d=r.q.dom;dom[d]=dom[d]||[0,0];dom[d][1]++;if(r.ok)dom[d][0]++;});
 app.innerHTML=`${topbar()}<div class="panel"><h2>⚖️ The verdict</h2>
 <div class="hero" style="margin:24px 0 18px">${INSPECTOR(70)}<div class="speech">You scored <b>${correct} out of ${n}</b> (${Math.round(pct*100)}%). ${pct>=.8?'A superb performance – the jury is very impressed!':pct>=.6?'A strong case. Tidy up the weaker areas below and you’ll be flying.':pct>=.4?'Good effort under pressure. Focus on the red bars below – that’s where the marks are hiding.':'Tough trial! Work through the case files for the red areas, then come back for a retrial.'}</div></div>
 <p class="small">In the real Paper 1 there are 50 marks in 45 minutes, and it is added to the 20-mark spelling paper. The mark needed for the expected standard changes a little each year, so use this as practice rather than a prediction.</p>
 <h3>Marks by content area</h3><div class="bars">${Object.keys(DOMS).filter(d=>dom[d]).map(d=>`<div class="bar"><span>${d} ${DOMS[d].name}</span><div class="track"><div class="fill" style="width:${dom[d][0]/dom[d][1]*100}%;background:${dom[d][0]/dom[d][1]>=.75?'var(--green)':dom[d][0]/dom[d][1]>=.5?'var(--gold)':'var(--red)'}"></div></div><span>${dom[d][0]}/${dom[d][1]}</span></div>`).join('')}</div>
 <h3>Question by question</h3><div class="review">${Q.res.map((r,i)=>reviewItem(r,i)).join('')}</div>
 <div class="actions"><button class="btn sec" id="hq">Back to HQ</button></div></div>`;
 bindReview();document.getElementById('hq').onclick=home;
}
function endRapid(){
 const best=S.rapidBest;S.rapidBest=Math.max(S.rapidBest,Q.pts);S.points+=Q.pts*3;if(Q.pts>=10)award('rapid10');if(Q.pts>=20)award('rapid20');save();
 const wrong=Q.res.filter(r=>!r.ok);
 app.innerHTML=`${topbar()}<div class="panel"><h2>⚡ Interrogation over!</h2><div class="hero" style="margin:24px 0 18px">${INSPECTOR(70)}<div class="speech">You cracked <b>${Q.pts}</b> clues in 90 seconds. ${Q.pts>best?'🎉 A new personal best!':`Your best is ${S.rapidBest}.`}</div></div>
 ${wrong.length?`<h3>Ones that got away</h3><div class="review">${wrong.map((r,i)=>reviewItem(r,i)).join('')}</div>`:''}
 <div class="actions"><button class="btn" id="again">Go again</button><button class="btn sec" id="hq">Back to HQ</button></div></div>`;
 bindReview();document.getElementById('again').onclick=()=>start('rapid');document.getElementById('hq').onclick=home;
}

/* ============ pages ============ */
function topbar(){const r=rank();return `<header class="top"><div class="logo" id="logo">${INSPECTOR(46)}<h1>Inspector Clause<small>The Grammar Case Files · Y6 SATs</small></h1></div><span class="pill" id="ptsPill">${r[1]} · <b>${S.points}</b> pts</span><button class="iconbtn" id="snd" title="Sound">${S.sound?'🔊':'🔈'}</button></header>`;}
function bindTop(){const l=document.getElementById('logo');if(l)l.onclick=()=>{if(Q&&!Q.ended&&(Q.mode==='mock'||Q.mode==='rapid'))return;home();};const s=document.getElementById('snd');if(s)s.onclick=()=>{S.sound=!S.sound;save();s.textContent=S.sound?'🔊':'🔈';};}
new MutationObserver(bindTop).observe(app,{childList:true});
function home(){
 Q=null;clearInterval(window._tm);const r=rank(),nx=nextRank();const coldN=Object.keys(S.cold).filter(k=>G[k]).length;
 app.innerHTML=`${topbar()}
 <div class="hero">${INSPECTOR(84)}<div><div class="speech"><b>Welcome to the Grammar Squad, ${r[1]}!</b> Every SATs grammar question is a little mystery. Spot the clues, crack the case – and if you get stuck, the case notes will show you <i>why</i> the answer is the answer.</div><p class="small" style="margin-top:8px">${nx?`${nx[0]-S.points} points to promotion: <b>${nx[1]}</b>`:'You have reached the top rank!'} · ${Object.keys(S.trophies).length}/${TROPHIES.length} trophies</p></div></div>
 <div class="secthead">📂 Case files – one for each part of the test</div>
 <div class="grid">${Object.entries(DOMS).map(([k,d])=>`<button class="folder" data-tab="${d.tab}" data-dom="${k}"><h3>${d.icon} ${d.name}</h3><p>${d.desc}</p><span class="weight">≈${d.weight}% of Paper 1 (2026)</span><div class="stars">${'★'.repeat(S.stars[k]||0)}<span style="opacity:.3">${'★'.repeat(3-(S.stars[k]||0))}</span></div></button>`).join('')}
 <button class="folder special" data-tab="MIXED" id="patrol"><h3>🚓 Mixed Patrol</h3><p>12 questions from every case file, weighted like the real paper.</p></button></div>
 <div class="secthead">🏛️ Test conditions</div>
 <div class="grid"><button class="folder red" data-tab="TRIAL" id="mock25"><h3>⚖️ Half Paper</h3><p>25 questions · 23 minutes · no hints. Marked at the end with full case notes.</p></button>
 <button class="folder red" data-tab="TRIAL" id="mock50"><h3>🏛️ The Full Trial</h3><p>50 questions · 45 minutes – just like Paper 1 on SATs morning.</p></button>
 <button class="folder special" data-tab="SPEED" id="rapid"><h3>⚡ Rapid Interrogation</h3><p>90 seconds. How many can you crack? Skipping costs 3 seconds! Best: <b>${S.rapidBest}</b></p></button>
 <button class="folder ${coldN?'':'green'}" data-tab="COLD" id="cold"><h3>🧊 Cold Cases (${coldN})</h3><p>${coldN?'Skills that slipped through. Crack them to clear them!':'No cold cases – your files are clear!'}</p></button></div>
 <div class="secthead">🧰 Detective’s toolkit</div>
 <div class="grid"><button class="folder green" data-tab="BRIEF" id="brief"><h3>📋 Briefing: what to expect</h3><p>How the SATs grammar test works and the question types you’ll meet.</p></button>
 <button class="folder green" data-tab="LOCKER" id="locker"><h3>🗄️ Evidence Locker</h3><p>Every grammar term explained with an example – and a 5-question drill for each.</p></button>
 <button class="folder green" data-tab="TROPHY" id="tro"><h3>🏆 Trophy Cabinet</h3><p>${Object.keys(S.trophies).length} of ${TROPHIES.length} unlocked.</p></button></div>`;
 app.querySelectorAll('[data-dom]').forEach(b=>b.onclick=()=>start('case',{dom:b.dataset.dom}));
 const on=(id,f)=>document.getElementById(id).onclick=f;
 on('patrol',()=>start('patrol'));on('mock25',()=>start('mock',{n:25}));on('mock50',()=>start('mock',{n:50}));on('rapid',()=>start('rapid'));
 on('cold',()=>{if(!coldN){toast('🧊 <div>No cold cases yet – keep investigating!</div>');return;}start('cold');});
 on('brief',briefing);on('locker',locker);on('tro',trophies);
 window.scrollTo(0,0);
}
function back(){return `<div class="actions" style="margin-top:0;margin-bottom:12px"><button class="btn sec" id="hqb">← Back to HQ</button></div>`;}
function briefing(){
 const types=[['Tick one / tick two','Choose the right option(s). Read carefully – is it ONE or TWO? Watch out for “NOT”.','pu_speech'],['Circle','Circle a word (or all the words) of a certain type.','wc_circle'],['Underline','Underline a clause or phrase – e.g. the subordinate or relative clause.','cl_sub'],['Tick boxes in a table','One tick per row: e.g. statement / question / command / exclamation.','fn_table'],['Draw lines to match','Match words to meanings, or informal to formal.','vo_match'],['Insert punctuation','Add commas, brackets, dashes etc. in the right places.','pu_paren'],['Write a word or phrase','e.g. a contraction or a verb form. Spell it carefully!','vb_write']];
 app.innerHTML=`${topbar()}${back()}<div class="panel"><h2>📋 Briefing: the SATs grammar test</h2>
 <p>In Year 6, the <b>English grammar, punctuation and spelling</b> (GPS) test has two papers, taken on the Monday of SATs week in May (in 2026 it was Monday 11 May):</p>
 <div class="kv"><div>Paper 1: questions<b>50 marks</b>45 minutes · grammar, punctuation & vocabulary</div><div>Paper 2: spelling<b>20 marks</b>20 words read aloud in sentences</div><div>Total<b>70 marks</b>turned into a scaled score – 100 means “expected standard”</div></div>
 <p>This site trains you for <b>Paper 1</b>. Most questions are worth 1 mark, and most just need a tick, circle, line or a very short answer. A few near the end ask you to write a word, phrase or sentence.</p>
 <h3>What gets tested (and how much)</h3>
 <p class="small">Paper 1 must have 25–35 grammar marks, 10–20 punctuation marks and 3–7 vocabulary marks. Here’s roughly how the 2026 paper split its questions:</p>
 <div class="bars">${Object.entries(DOMS).sort((a,b)=>b[1].weight-a[1].weight).map(([k,d])=>`<div class="bar"><span>${d.icon} ${k} ${d.name}</span><div class="track"><div class="fill" style="width:${d.weight/30*100}%"></div></div><span>${d.weight}%</span></div>`).join('')}</div>
 <p class="small">Punctuation is the biggest slice, then word classes, then verb forms.</p>
 <h3>Question types you’ll meet</h3>
 <div class="gloss">${types.map((t,i)=>`<div class="gitem"><b>${t[0]}</b><div class="ex">${t[1]}</div><button class="btn sec" data-try="${t[2]}">Try one</button></div>`).join('')}</div>
 <h3>Detective’s top tips</h3><ol>
 <li><b>Read the instruction twice.</b> Circle or underline? Tick one or tick two? Is there a sneaky “NOT”?</li>
 <li><b>Look at the job a word is doing</b>, not just the word. “After” can be a preposition <i>or</i> a conjunction; “right” can be an adjective <i>or</i> an adverb.</li>
 <li><b>Punctuation must be clear.</b> Make commas look like commas and apostrophes sit up high. Put them exactly in the right place.</li>
 <li><b>Commands can hide!</b> “When the bell rings, line up quietly” is still a command.</li>
 <li><b>Exclamations start with What or How</b> and have a verb: “What a huge dog that is!”</li>
 <li><b>Don’t leave blanks.</b> If you’re unsure, make your best detective guess and move on – then come back if you have time.</li></ol>
 <h3>How to use this site</h3><p><b>Case files</b> practise one area at a time. <b>Mixed Patrol</b> mixes them up like the real paper. <b>The Trial</b> is a timed mock. Anything you miss goes into <b>Cold Cases</b> so you can come back to it. Every question has <b>case notes</b> explaining why the answer is right – and the questions change every time you play.</p></div>`;
 document.getElementById('hqb').onclick=home;
 app.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>start('drill',{ids:[b.dataset.try],term:'Try it: '+G[b.dataset.try].skill}));
}
function locker(){
 app.innerHTML=`${topbar()}${back()}<div class="panel"><h2>🗄️ The Evidence Locker</h2><p>Every term you need for the SATs grammar test. Tap <b>Drill</b> to practise that skill with 5 fresh questions.</p>
 ${Object.entries(GLOSS).map(([d,arr])=>`<h3>${DOMS[d].icon} ${d} · ${DOMS[d].name}</h3><div class="gloss">${arr.map((g,i)=>`<div class="gitem"><b>${g[0]}</b> – ${g[1]}<div class="ex">e.g. ${g[2]}</div><button class="btn sec" data-d="${d}" data-i="${i}">Drill this ▶</button></div>`).join('')}</div>`).join('')}</div>`;
 document.getElementById('hqb').onclick=home;
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const g=GLOSS[b.dataset.d][+b.dataset.i];start('drill',{ids:g[3],term:g[0]});});
}
function trophies(){
 app.innerHTML=`${topbar()}${back()}<div class="panel"><h2>🏆 Trophy Cabinet</h2><p>Rank: <b>${rank()[1]}</b> · ${S.points} points · best streak ${S.bestStreak} · rapid best ${S.rapidBest}</p>
 <div class="troph">${TROPHIES.map(t=>`<div class="tro${S.trophies[t[0]]?' got':''}"><span class="ic">${t[1]}</span><div><b>${t[2]}</b><small>${t[3]}</small></div></div>`).join('')}</div>
 <h3>Ranks</h3><p class="small">${RANKS.map(r=>`${r[1]} (${r[0]})`).join(' → ')}</p>
 <div class="actions"><button class="btn red" id="reset">Reset all progress</button></div></div>`;
 document.getElementById('hqb').onclick=home;
 document.getElementById('reset').onclick=e=>{const rb=e.target;if(!rb.dataset.sure){rb.dataset.sure=1;rb.textContent='Tap again to wipe everything';return;}{const snd=S.sound;S={points:0,stars:{},cases:{},cold:{},coldCleared:0,trophies:{},rapidBest:0,whys:0,bestStreak:0,drills:[],mocks:0,sound:snd};save();home();}};
}
window.addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight;});
home();
